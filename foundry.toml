[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
# Lower runs shrink bytecode (TradeManager is near the 24,576 B EIP-170 limit on Amoy/mainnet).
optimizer_runs = 1
# Required so `TradeManager` stays under the 24,576 B EIP-170 contract size limit on Amoy/mainnet.
via_ir = true
# Smaller runtime bytecode; verify still works if your workflow needs metadata on-chain.
bytecode_hash = "none"
cbor_metadata = false
evm_version = "cancun"

[rpc_endpoints]
amoy = "${AMOY_RPC_URL}"

[etherscan]
amoy = { key = "${POLYGONSCAN_API_KEY}", url = "https://api-amoy.polygonscan.com/api", chain = 80002 }

[fmt]
line_length = 120

# Style-only `note[...]` output during `forge build` (OpenZeppelin / PRD naming: goldNFT, verifyKYC, __gap, etc.).
[lint]
lint_on_build = false
